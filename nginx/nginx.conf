server {
    listen 80;
    listen [::]:80;
    server_name film-react-nest-project.nomorepartiessite.ru ://film-react-nest-project.nomorepartiessite.ru;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name film-react-nest-project.nomorepartiessite.ru ://film-react-nest-project.nomorepartiessite.ru;

    ssl_certificate /etc/letsencrypt/live/film-react-nest-project.nomorepartiessite.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/film-react-nest-project.nomorepartiessite.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        root /var/www/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000; 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /content/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }
}
