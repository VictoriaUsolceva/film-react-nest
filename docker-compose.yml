services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_container
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    ports:
      - "${DATABASE_PORT}:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT}:80"
    networks:
      - app-network
    depends_on:
      - postgres-db

  frontend:
    build: ./frontend
    image: ghcr.io/victoriausolceva/film-react-nest/frontend:latest
    container_name: frontend_builder_container
    volumes:
      - frontend_static:/var/www/html
    networks:
      - app-network

  backend:
    build: ./backend
    image: ghcr.io/victoriausolceva/film-react-nest/backend:latest
    container_name: backend_container
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres-db
      PORT: ${BACKEND_PORT}
    networks:
      - app-network
    restart: on-failure
    depends_on:
      - postgres-db

  nginx-server:
    build: ./nginx
    image: ghcr.io/victoriausolceva/film-react-nest/nginx:latest
    container_name: nginx_container
    ports:
      - "${APP_PORT}:80"
    restart: always
    volumes:
      - frontend_static:/var/www/html:ro
    networks:
      - app-network
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:          
  pgadmin_data:    
  frontend_static: 

networks:
  app-network:
    driver: bridge
